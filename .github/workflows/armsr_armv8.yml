name: Build ImmortalWrt-25.12 for armsr_armv8

on:
  workflow_dispatch:
   inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false
  schedule:
    - cron: "0 0 1,16 * *"

permissions:
  contents: write


env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update > /dev/null
        sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
        sudo -E apt-get -qq autoremove --purge > /dev/null
        sudo -E apt-get -qq clean > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: Update & Install feeds
      run: |
        chmod +x armsr/armv8/diy/diy.sh
        cd openwrt
        ./scripts/feeds update -a
        $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load N1 custom config
      run: |
        rm -rf openwrt/files openwrt/.config
        mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/

    - name: SSH connect to Actions
      uses: P3TERX/ssh2actions@main
      if: github.event.inputs.ssh == 'true'

    - name: Prepare honk build dependencies
      working-directory: ./openwrt
      shell: bash
      run: |
        set -euo pipefail
        honk_source="$PWD/package/daeuniverse/honk/src"
        test -f "$honk_source/rust-toolchain.toml"
        test -f "$honk_source/crates/honk-ebpf/rust-toolchain.toml"
        test -f "$honk_source/.github/ci/pins.env"

        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev pkg-config cmake libclang-dev zstd

        cargo_dir="${CARGO_HOME:-$HOME/.cargo}"
        mkdir -p "$cargo_dir/bin"
        export CARGO_HOME="$cargo_dir"
        export PATH="$cargo_dir/bin:$PATH"
        echo "CARGO_HOME=$cargo_dir" >> "$GITHUB_ENV"
        echo "$cargo_dir/bin" >> "$GITHUB_PATH"
        command -v rustup

        stable_channel="$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["toolchain"]["channel"])' "$honk_source/rust-toolchain.toml")"
        ebpf_channel="$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["toolchain"]["channel"])' "$honk_source/crates/honk-ebpf/rust-toolchain.toml")"

        rustup toolchain install "$stable_channel" --profile minimal
        rustup target add --toolchain "$stable_channel" aarch64-unknown-linux-musl
        rustup toolchain install "$ebpf_channel" --profile minimal \
          --component rust-src --component llvm-tools

        source "$honk_source/.github/ci/pins.env"
        linker_archive="$RUNNER_TEMP/honk-bpf-linker.tar.zst"
        curl -fsSL --retry 3 -o "$linker_archive" \
          "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
        echo "${BPF_LINKER_SHA256}  ${linker_archive}" | sha256sum -c -
        zstd -dc "$linker_archive" | tar -xf - -C "$cargo_dir/bin"

        rustc +"$stable_channel" --version
        rustup target list --toolchain "$stable_channel" --installed
        bpf-linker --version

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec rm -f {} \;

    - name: Compile N1 firmware
      run: |
        chmod -R 755 openwrt
        cd openwrt
        echo -e "$(nproc) thread compile"
        set -o pipefail
        make -j$(( $(nproc) + 1 )) V=s BUILD_LOG=1 2>&1 | tee compile-parallel.log || \
          make -j1 V=s BUILD_LOG=1 2>&1 | tee compile-serial.log

    - name: Upload build failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: n1-build-failure-logs
        path: |
          openwrt/compile-parallel.log
          openwrt/compile-serial.log
          openwrt/logs/
          openwrt/.config
          openwrt/feeds.conf.default
        if-no-files-found: warn

    - name: Package N1 firmware
      uses: ophub/amlogic-s9xxx-openwrt@main
      with:
        openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
        openwrt_board: s905d
        kernel_repo: ophub/kernel
        kernel_usage: flippy
        openwrt_kernel: 6.12.y
        builder_name: nantayo

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: OpenWrt_${{ env.FILE_DATE }}
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        body: |
          首次使用建议全新刷写
          * 基本信息
          IP: 192.168.1.4
          账户: root
          密码: password

    - name: Delete old releases
      uses: mgz0227/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags : true
